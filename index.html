<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>La Poste</title>
</head>
<body>
    <form class="form custom-form">
        <h1>Inscription au concours de la Poste</h1>
        <section>
            <input id="email" class="input" type="email"  placeholder="Entrer votre email" />
            <input id="password" class="input" type="password" placeholder="Entrer votre mot de passe" />
        </section>
        <section>
            <button class="button" type="submit">Valider</button>
            <button class="button" type="reset">Réinitialiser</button>
        </section>
    </form>
    <script src="./bad-script.js"></script>
</body>
</html>
